const STRIPE_PUBLISHABLE_KEY = "pk_test_REPLACE_WITH_YOUR_PUBLISHABLE_KEY";
const PAYMENT_INTENT_ENDPOINT = "https://YOUR-BACKEND-DOMAIN.example.com/create-payment-intent";

function useStripe() {
  const [stripe, setStripe] = useState(null);
  useEffect(() => {
    if (window.Stripe) {
      setStripe(window.Stripe(STRIPE_PUBLISHABLE_KEY));
      return;
    }
    const existing = document.querySelector('script[src="https://js.stripe.com/v3/"]');
    const onLoad = () => setStripe(window.Stripe(STRIPE_PUBLISHABLE_KEY));
    if (existing) {
      existing.addEventListener("load", onLoad);
      return () => existing.removeEventListener("load", onLoad);
    }
    const script = document.createElement("script");
    script.src = "https://js.stripe.com/v3/";
    script.async = true;
    script.onload = onLoad;
    document.body.appendChild(script);
  }, []);
  return stripe;
}

function BookingModal({ tour, lang, onClose }) {
  const dir = RTL_LANGS.includes(lang) ? "rtl" : "ltr";
  const [step, setStep] = useState(1);
  const [date, setDate] = useState("");
  const [guests, setGuests] = useState(2);
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");
  const [payError, setPayError] = useState("");
  const [paying, setPaying] = useState(false);
  const [success, setSuccess] = useState(false);

  const stripe = useStripe();
  const elementsRef = useRef(null);
  const cardRef = useRef(null);
  const cardMountRef = useRef(null);

  const total = tour.price * guests;

  useEffect(() => {
    if (step === 3 && stripe && cardMountRef.current && !cardRef.current) {
      const elements = stripe.elements();
      elementsRef.current = elements;
      const card = elements.create("card", {
        style: {
          base: {
            fontSize: "16px",
            color: "#241d10",
            fontFamily: "Inter, sans-serif",
            "::placeholder": { color: "#9b8f74" },
          },
          invalid: { color: "#c0392b" },
        },
      });
      card.mount(cardMountRef.current);
      cardRef.current = card;
    }
  }, [step, stripe]);

  async function handlePay() {
    setPayError("");
    if (!stripe || !cardRef.current) {
      setPayError(
        lang === "tr"
          ? "Ödeme sistemi yükleniyor, birkaç saniye sonra tekrar deneyin."
          : "Payment system is loading, please try again in a moment."
      );
      return;
    }
    setPaying(true);
    try {
      const res = await fetch(PAYMENT_INTENT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ amount: Math.round(total * 100), currency: "usd", tourId: tour.id, email }),
      });
      const data = await res.json();
      const confirm = await stripe.confirmCardPayment(data.clientSecret, {
        payment_method: { card: cardRef.current, billing_details: { name, email } },
      });
      if (confirm.error) throw new Error(confirm.error.message);
      setSuccess(true);
    } catch (e) {
      setPayError(
        (lang === "tr" ? "Bu demoda gerçek bir ödeme sunucusu bağlı değil. " : "This demo has no live payment backend connected. ") +
          (e.message || "")
      );
    } finally {
      setPaying(false);
    }
  }

  return (
    <div className="tk-modal-backdrop" onClick={onClose}>
      <div className="tk-modal" dir={dir} onClick={(e) => e.stopPropagation()}>
        <button className="tk-modal-close" onClick={onClose} aria-label="Close">
          <X size={20} />
        </button>

        {!success ? (
          <>
            <h3 className="tk-modal-title">{t(DICT.booking.title, lang)}</h3>
            <p className="tk-modal-tour">{t(tour.name, lang)}</p>

            <div className="tk-steps">
              {[1, 2, 3].map((n) => (
                <div key={n} className={`tk-step-dot ${step >= n ? "active" : ""}`}>{n}</div>
              ))}
            </div>

            {step === 1 && (
              <div className="tk-form">
                <label>{t(DICT.booking.date, lang)}</label>
                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
                <label>{t(DICT.booking.guests, lang)}</label>
                <input type="number" min={1} max={12} value={guests} onChange={(e) => setGuests(Number(e.target.value))} />
                <button className="tk-btn tk-btn-gold" disabled={!date} onClick={() => setStep(2)}>
                  {t(DICT.booking.next, lang)}
                </button>
              </div>
            )}

            {step === 2 && (
              <div className="tk-form">
                <label>{t(DICT.contact.name, lang)}</label>
                <input type="text" value={name} onChange={(e) => setName(e.target.value)} />
                <label>{t(DICT.contact.email, lang)}</label>
                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} />
                <div className="tk-form-row">
                  <button className="tk-btn tk-btn-ghost" onClick={() => setStep(1)}>{t(DICT.booking.back, lang)}</button>
                  <button className="tk-btn tk-btn-gold" disabled={!name || !email} onClick={() => setStep(3)}>
                    {t(DICT.booking.next, lang)}
                  </button>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="tk-form">
                <div className="tk-total-row">
                  <span>{t(DICT.booking.total, lang)}</span>
                  <strong>${total}</strong>
                </div>
                <label>{lang === "tr" ? "Kart Bilgileri" : lang === "ar" ? "بيانات البطاقة" : lang === "zh" ? "卡信息" : "Card Details"}</label>
                <div className="tk-card-element" ref={cardMountRef} />
                <p className="tk-demo-note">{t(DICT.booking.demoNote, lang)}</p>
                {payError && <p className="tk-pay-error">{payError}</p>}
                <div className="tk-form-row">
                  <button className="tk-btn tk-btn-ghost" onClick={() => setStep(2)}>{t(DICT.booking.back, lang)}</button>
                  <button className="tk-btn tk-btn-gold" disabled={paying} onClick={handlePay}>
                    {paying ? "…" : t(DICT.booking.pay, lang)}
                  </button>
                </div>
              </div>
            )}
          </>
        ) : (
          <div className="tk-success">
            <div className="tk-success-icon"><Check size={30} /></div>
            <h3>{t(DICT.booking.success, lang)}</h3>
            <p>{t(DICT.booking.successSub, lang)}</p>
            <button className="tk-btn tk-btn-gold" onClick={onClose}>OK</button>
          </div>
        )}
      </div>
    </div>
  );
}

function TourKeySite() {
  const [lang, setLang] = useState("tr");
  const [page, setPage] = useState("home");
  const [activeTour, setActiveTour] = useState(null);
  const [bookingTour, setBookingTour] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const dir = RTL_LANGS.includes(lang) ? "rtl" : "ltr";

  useEffect(() => {
    document.documentElement.dir = dir;
  }, [dir]);

  const goto = (p) => {
    setPage(p);
    setMenuOpen(false);
    setActiveTour(null);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  return (
    <div className="tk-root" dir={dir}>
      <style>{CSS}</style>

      {/* HEADER */}
      <header className="tk-header">
        <div className="tk-header-inner">
          <button className="tk-logo-btn" onClick={() => goto("home")}>
            <Logo size="sm" align="left" lang={lang} />
          </button>

          <nav className={`tk-nav ${menuOpen ? "open" : ""}`}>
            <button onClick={() => goto("home")} className={page === "home" ? "active" : ""}>{t(DICT.nav.home, lang)}</button>
            <button onClick={() => goto("tours")} className={page === "tours" ? "active" : ""}>{t(DICT.nav.tours, lang)}</button>
            <button onClick={() => goto("safety")} className={page === "safety" ? "active" : ""}>{t(DICT.nav.safety, lang)}</button>
            <button onClick={() => goto("contact")} className={page === "contact" ? "active" : ""}>{t(DICT.nav.contact, lang)}</button>
          </nav>

          <div className="tk-header-right">
            <div className="tk-lang-switch">
              <Globe2 size={15} />
              {LANGS.map((l) => (
                <button key={l} className={lang === l ? "active" : ""} onClick={() => setLang(l)}>
                  {l.toUpperCase()}
                </button>
              ))}
            </div>
            <button className="tk-menu-toggle" onClick={() => setMenuOpen((o) => !o)}>
              <Menu size={22} />
            </button>
          </div>
        </div>
      </header>

      {page === "home" && (
        <Home lang={lang} goto={goto} openTour={setActiveTour} openBooking={setBookingTour} />
      )}
      {page === "tours" && (
        <ToursPage lang={lang} openTour={setActiveTour} openBooking={setBookingTour} />
      )}
      {page === "safety" && <SafetyPage lang={lang} />}
      {page === "contact" && <ContactPage lang={lang} />}

      {activeTour && (
        <TourDetail
          tour={activeTour}
          lang={lang}
          onClose={() => setActiveTour(null)}
          onBook={() => {
            setBookingTour(activeTour);
            setActiveTour(null);
          }}
        />
      )}
      {bookingTour && <BookingModal tour={bookingTour} lang={lang} onClose={() => setBookingTour(null)} />}

      <footer className="tk-footer">
        <Logo size="lg" align="center" lang={lang} />
        <a className="tk-footer-app-link" href={APP_DOWNLOAD_URL} target="_blank" rel="noopener noreferrer">
          <Download size={13} /> {t(DICT.safety.appDownload, lang)}
        </a>
        <p>© {new Date().getFullYear()} Tour Key. {t(DICT.footer.rights, lang)}</p>
      </footer>
    </div>
  );
}

.tk-app-card-body p { color: #c7d2df; margin: 0; font-size: 14px; }
.tk-footer-app-link { display: inline-flex; align-items: center; gap: 6px; color: var(--gold-1); font-size: 13px; font-weight: 700; text-decoration: none; }
.tk-footer-app-link:hover { text-decoration: underline; }
.tk-root[dir="rtl"] .tk-safety-card { text-align: right; }
.tk-safety-card svg { color: var(--gold-3); margin-bottom: 12px; }
.tk-safety-card p { color: var(--ink-soft); font-size: 14px; }
.tk-safety-badge { margin-top: 32px; display: inline-flex; align-items: center; gap: 8px; background: rgba(43,169,180,0.1); color: var(--teal); font-weight: 700; font-size: 13px; padding: 10px 20px; border-radius: 20px; }

.tk-contact-form { max-width: 480px; margin: 0 auto; text-align: left; }
.tk-contact-info { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; margin-top: 30px; color: var(--ink-soft); font-size: 14px; }
.tk-contact-info span { display: flex; align-items: center; gap: 6px; }

.tk-form { display: flex; flex-direction: column; gap: 6px; }
.tk-form label { font-size: 12.5px; font-weight: 700; color: var(--navy); margin-top: 8px; }
.tk-form input, .tk-form textarea { border: 1.5px solid #e4d8b8; border-radius: 10px; padding: 11px 14px; font-size: 14px; font-family: inherit; background: #fff; }
.tk-form input:focus, .tk-form textarea:focus { outline: 2px solid var(--teal); border-color: var(--teal); }
.tk-form-row { display: flex; gap: 10px; margin-top: 14px; }
.tk-form-row .tk-btn { flex: 1; justify-content: center; }
.tk-form > .tk-btn { margin-top: 16px; }
.tk-total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; color: var(--navy); background: var(--parchment); padding: 12px 14px; border-radius: 10px; margin-bottom: 4px; }
.tk-card-element { border: 1.5px solid #e4d8b8; border-radius: 10px; padding: 12px 14px; background: #fff; }
.tk-demo-note { font-size: 11.5px; color: var(--ink-soft); font-style: italic; }
.tk-pay-error { font-size: 12.5px; color: #c0392b; background: #fdecea; padding: 8px 12px; border-radius: 8px; }

.tk-steps { display: flex; gap: 8px; margin: 10px 0 18px; }
.tk-step-dot { width: 26px; height: 26px; border-radius: 50%; background: #eee1c2; color: var(--ink-soft); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
.tk-step-dot.active { background: var(--gold-2); color: #fff; }

.tk-modal-backdrop { position: fixed; inset: 0; background: rgba(14,32,56,0.55); backdrop-filter: blur(3px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
.tk-modal { background: var(--parchment-soft); border-radius: 20px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px 26px; position: relative; }
.tk-modal-wide { max-width: 640px; padding: 0; overflow: hidden; }
.tk-modal-close { position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.06); border: none; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; }
.tk-modal-title { margin-bottom: 4px; }
.tk-modal-tour { color: var(--ink-soft); font-size: 13px; margin-bottom: 6px; }
.tk-detail-img { height: 240px; background-size: cover; background-position: center; }
.tk-detail-body { padding: 26px 28px 30px; }
.tk-detail-meta { display: flex; gap: 18px; align-items: center; margin: 16px 0; color: var(--ink-soft); font-size: 13px; }
.tk-detail-meta span { display: flex; align-items: center; gap: 6px; }
.tk-detail-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; }

.tk-success { text-align: center; padding: 20px 0; }
.tk-success-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--teal); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.tk-success .tk-btn { margin-top: 16px; }

.tk-footer { background: var(--navy-deep); color: #9fb0c3; text-align: center; padding: 40px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.tk-footer p { font-size: 12.5px; margin: 0; }
